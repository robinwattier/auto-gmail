name: Gmail Agent Auto-Scan (Cron)

on:
  schedule:
    # Exécution toutes les 10 minutes (ou modifiez selon vos besoins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet de déclencher manuellement depuis l'interface GitHub

jobs:
  run-gmail-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du cycle de scan Gmail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_NAME: ${{ secrets.USER_NAME || 'Robin' }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          AUTO_DRAFT: "true"
          RUN_ONCE: "true"
        run: |
          python agent.py --once --auto-draft

